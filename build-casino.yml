                      it = byName("gray_stained_glass_pane", "stained_glass_pane:7", "paper");
                  }
                  if (it == null) {
                      it = Item.get(1);
                  }
                  try {
                      if (name != null) {
                          it.setCustomName(c(name));
                      }
                      if (lore != null && lore.length > 0) {
                          String[] l = new String[lore.length];
                          for (int i = 0; i < lore.length; i++) {
