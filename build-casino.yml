name: Build Casino

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-casino.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create sources
        run: |
          set -e
          mkdir -p "$(dirname 'Casino/pom.xml')"
          cat > 'Casino/pom.xml' << 'CASINO_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>ru.eclips</groupId>
              <artifactId>Casino</artifactId>
              <version>1.0.1</version>
              <packaging>jar</packaging>

              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>lanink</id>
                      <url>https://repo.lanink.cn/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>cn.nukkit</groupId>
                      <artifactId>Nukkit</artifactId>
                      <version>MOT-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <finalName>Casino-${project.version}</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <release>17</release>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          CASINO_EOF
          mkdir -p "$(dirname 'Casino/src/main/java/ru/eclips/casino/Casino.java')"
          cat > 'Casino/src/main/java/ru/eclips/casino/Casino.java' << 'CASINO_EOF'
          package ru.eclips.casino;

          import cn.nukkit.Player;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.EventPriority;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.inventory.InventoryCloseEvent;
          import cn.nukkit.event.inventory.InventoryTransactionEvent;
          import cn.nukkit.event.player.PlayerDropItemEvent;
          import cn.nukkit.event.player.PlayerFormRespondedEvent;
          import cn.nukkit.event.player.PlayerJoinEvent;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.form.element.ElementButton;
          import cn.nukkit.form.element.ElementDropdown;
          import cn.nukkit.form.element.ElementInput;
          import cn.nukkit.form.element.ElementLabel;
          import cn.nukkit.form.element.ElementSlider;
          import cn.nukkit.form.response.FormResponse;
          import cn.nukkit.form.response.FormResponseCustom;
          import cn.nukkit.form.response.FormResponseSimple;
          import cn.nukkit.form.window.FormWindow;
          import cn.nukkit.form.window.FormWindowCustom;
          import cn.nukkit.form.window.FormWindowSimple;
          import cn.nukkit.inventory.transaction.InventoryTransaction;
          import cn.nukkit.inventory.transaction.action.InventoryAction;
          import cn.nukkit.inventory.transaction.action.SlotChangeAction;
          import cn.nukkit.plugin.PluginBase;
          import cn.nukkit.scheduler.Task;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;

          /**
           * Casino: /casino (формы + виртуальный сундук) и /spin. Валюта: монеты TpCoins.
           * Слоты, Мины, Рулетка, 3 сундука, Колесо фортуны. Исход всегда решает сервер (SecureRandom).
           */
          public class Casino extends PluginBase implements Listener {

              private interface FormHandler {
                  void on(FormResponse response);
              }

              private static final class FormCtx {
                  final int id;
                  final FormHandler handler;

                  FormCtx(int id, FormHandler handler) {
                      this.id = id;
                      this.handler = handler;
                  }
              }

              private static final class Delayed {
                  final long at;
                  final Runnable run;

                  Delayed(long at, Runnable run) {
                      this.at = at;
                      this.run = run;
                  }
              }

              private Coins coins;
              private Store store;
              private long tickNo;
              private final List<Delayed> delayed = new ArrayList<>();
              private final Map<String, Session> sessions = new HashMap<>();
              private final Map<String, FormCtx> forms = new HashMap<>();
              private final Map<String, Long> lastAction = new HashMap<>();

              // ====================================================================
              // Жизненный цикл
              // ====================================================================

              @Override
              public void onEnable() {
                  saveDefaultConfig();
                  coins = new Coins(this);
                  store = new Store(this, getConfig().getInt("log-keep-days", 30));
                  getServer().getPluginManager().registerEvents(this, this);
                  if (!startTicker()) {
                      getLogger().error("Не удалось запустить таймер казино, плагин выключен.");
                      getServer().getPluginManager().disablePlugin(this);
                      return;
                  }
                  if (!coins.init()) {
                      getLogger().warning("TpCoins пока не найден: игры будут недоступны, пока он не загрузится.");
                  }
                  // выплаты по играм, оборванным падением сервера
                  later(60, this::payAllPending);
                  getLogger().info("Casino включено.");
              }

              @Override
              public void onDisable() {
                  for (Session s : new ArrayList<>(sessions.values())) {
                      try {
                          endSession(s);
                      } catch (Throwable ignored) {
                          // идём дальше
                      }
                  }
                  if (store != null) {
                      store.shutdown();
                  }
              }

              /** Таймер: каждый тик заново ставит себя через scheduleDelayedTask(Task, int), как в рабочем TopShop. */
              private boolean startTicker() {
                  try {
                      scheduleNext();
                      return true;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private void scheduleNext() {
                  getServer().getScheduler().scheduleDelayedTask(new Task() {
                      @Override
                      public void onRun(int currentTick) {
                          try {
                              tick();
                          } finally {
                              if (isEnabled()) {
                                  scheduleNext();
                              }
                          }
                      }
                  }, 1);
              }

              void later(int ticks, Runnable r) {
                  delayed.add(new Delayed(tickNo + Math.max(1, ticks), r));
              }

              private void tick() {
                  tickNo++;
                  if (!delayed.isEmpty()) {
                      List<Runnable> due = null;
                      for (Iterator<Delayed> it = delayed.iterator(); it.hasNext(); ) {
                          Delayed d = it.next();
                          if (d.at <= tickNo) {
                              if (due == null) {
                                  due = new ArrayList<>();
                              }
                              due.add(d.run);
                              it.remove();
                          }
                      }
                      if (due != null) {
                          for (Runnable r : due) {
                              try {
                                  r.run();
                              } catch (Throwable t) {
                                  getLogger().warning("Ошибка в отложенной задаче: " + t);
                              }
                          }
                      }
                  }
                  if (!sessions.isEmpty()) {
                      for (Session s : new ArrayList<>(sessions.values())) {
                          try {
                              if (s.ended) {
                                  continue;
                              }
                              if (s.menu != null && s.menuOpened) {
                                  if (s.game != null) {
                                      s.game.tick();
                                  }
                              } else if (!s.menuOpened && tickNo - s.created > 100) {
                                  endSession(s); // окно так и не открылось - возвращаем что причитается
                              }
                          } catch (Throwable t) {
                              getLogger().warning("Ошибка игры " + s.type + ": " + t);
                              endSession(s);
                          }
                      }
                  }
                  if (tickNo % 1200 == 0) {
                      store.saveStats();
                  }
              }

              // ====================================================================
              // Вспомогательное
              // ====================================================================

              private void msg(Player p, String text) {
                  if (p != null && p.isOnline()) {
                      p.sendMessage(Fx.c(getConfig().getString("prefix", "&6[Казино]&r ")) + Fx.c(text));
                  }
              }

              private long minBet() {
                  return Math.max(1, getConfig().getInt("min-bet", 500));
              }

              private long maxBet() {
                  return Math.max(minBet(), getConfig().getInt("max-bet", 50000));
              }

              private long cooldownMs() {
                  return Math.max(0, getConfig().getInt("cooldown-seconds", 3)) * 1000L;
              }

              private boolean freeReady(String key) {
                  long hours = Math.max(1, getConfig().getInt("free-spin-hours", 24));
                  return System.currentTimeMillis() - store.lastFree(key) >= hours * 3600_000L;
              }

              private boolean worldDisabled(Player p) {
                  try {
                      String w = p.getLevel().getName();
                      String f = p.getLevel().getFolderName();
                      for (String d : getConfig().getStringList("disabled-worlds")) {
                          if (d.equalsIgnoreCase(w) || d.equalsIgnoreCase(f)) {
                              return true;
                          }
                      }
                  } catch (Throwable ignored) {
                      // считаем, что можно
                  }
                  return false;
              }

              private Player online(String key) {
                  for (Player p : getServer().getOnlinePlayers().values()) {
                      if (Coins.key(p.getName()).equals(key)) {
                          return p;
                      }
                  }
                  return null;
              }

              /** null - можно играть, иначе текст причины. */
              private String precheck(Player p, String key, long bet) {
                  if (!coins.init()) {
                      return "&cКазино временно недоступно.";
                  }
                  if (worldDisabled(p)) {
                      return "&cВ этом мире казино недоступно.";
                  }
                  Long last = lastAction.get(key);
                  long left = last == null ? 0 : cooldownMs() - (System.currentTimeMillis() - last);
                  if (left > 0) {
                      return "&eПодожди " + ((left + 999) / 1000) + " сек.";
                  }
                  if (bet > 0 && coins.balance(key) < bet) {
                      return "&cНедостаточно монет.";
                  }
                  return null;
              }

              private Game newGame(Session s) {
                  switch (s.type) {
                      case SLOTS:
                          return new SlotsGame(this, s);
                      case MINES:
                          return new MinesGame(this, s);
                      case ROULETTE:
                          return new RouletteGame(this, s);
                      case CHESTS:
                          return new ChestsGame(this, s);
                      default:
                          return new WheelGame(this, s);
                  }
              }

              // ====================================================================
              // Раунды, выплаты, сессии
              // ====================================================================

              void setOwed(Session s, long amount) {
                  s.owed = amount;
                  store.setPending(s.key, amount);
              }

              private void startRound(Player p, GameType t, long bet, int a, int b, boolean free) {
                  String key = Coins.key(p.getName());
                  Session old = sessions.get(key);
                  if (old != null) {
                      endSession(old);
                  }
                  String why = precheck(p, key, free ? 0 : bet);
                  if (why != null) {
                      msg(p, why);
                      return;
                  }
                  if (free) {
                      if (!freeReady(key)) {
                          msg(p, "&eБесплатный спин уже использован. Следующий через несколько часов.");
                          return;
                      }
                      store.markFree(key, System.currentTimeMillis());
                  } else if (!coins.take(key, bet, "казино: " + t.title)) {
                      msg(p, "&cНедостаточно монет.");
                      return;
                  }
                  Session s = new Session(p, key, t, free ? 0 : bet, free);
                  if (t == GameType.MINES) {
                      s.minesCount = a;
                  } else if (t == GameType.ROULETTE) {
                      s.rouletteKind = a;
                      s.rouletteNumber = b;
                  }
                  s.created = tickNo;
                  sessions.put(key, s);
                  lastAction.put(key, System.currentTimeMillis());
                  try {
                      setOwed(s, s.bet); // на любой случай: если что-то пойдёт не так, ставка вернётся
                      s.game = newGame(s);
                      setOwed(s, s.game.prepare());
                      s.menu = Menu.create(this, s, "&l" + t.title);
                      s.menu.display();
                  } catch (Throwable ex) {
                      getLogger().warning("Не удалось начать игру " + t + ": " + ex);
                      endSession(s);
                  }
              }

              private void playAgain(Session s) {
                  Player p = s.player;
                  String why = precheck(p, s.key, s.bet);
                  if (why != null) {
                      msg(p, why);
                      return;
                  }
                  if (!coins.take(s.key, s.bet, "казино: " + s.type.title)) {
                      msg(p, "&cНедостаточно монет.");
                      return;
                  }
                  s.resetRound();
                  lastAction.put(s.key, System.currentTimeMillis());
                  try {
                      setOwed(s, s.bet);
                      s.game = newGame(s);
                      setOwed(s, s.game.prepare());
                      s.game.begin();
                  } catch (Throwable ex) {
                      getLogger().warning("Ошибка новой игры " + s.type + ": " + ex);
                      endSession(s);
                  }
              }

              /** Выплатить причитающееся, записать лог и статистику. Вызывается один раз за раунд. */
              void settle(Session s, long win, String detail) {
                  if (s.settled) {
                      return;
                  }
                  s.settled = true;
                  long credited = 0;
                  if (win > 0) {
                      credited = coins.give(s.key, win, "казино: " + s.type.title);
                  }
                  if (credited >= 0) {
                      store.clearPending(s.key);
                  } else {
                      store.setPending(s.key, win); // выплатим позже (вход игрока или перезапуск)
                  }
                  s.owed = 0;
                  lastAction.put(s.key, System.currentTimeMillis());
                  Player p = s.player;
                  String nick = p.getName();
                  if (!s.played) {
                      if (win > 0) {
                          msg(p, "&eСтавка возвращена: " + Fx.n(win) + " монет.");
                      }
                      return;
                  }
                  String gameKey = s.free ? "FREE" : s.type.title;
                  store.record(gameKey, s.bet, Math.max(0, credited));
                  store.addTop(nick, s.free ? "Бесплатный спин" : s.type.title, s.bet, win);
                  store.log(nick, gameKey, s.bet, Math.max(0, credited), detail);
                  if (credited < 0) {
                      msg(p, "&eВыигрыш " + Fx.n(win) + " монет будет зачислен, как только экономика станет доступна.");
                      return;
                  }
                  if (s.free) {
                      msg(p, "&aБесплатный спин: +" + Fx.n(win) + " монет.");
                  } else if (win > s.bet) {
                      msg(p, "&aВыигрыш: +" + Fx.n(win) + " монет (x" + Fx.mult((double) win / s.bet) + ").");
                  } else if (win == s.bet) {
                      msg(p, "&eВозврат ставки: " + Fx.n(win) + " монет.");
                  } else if (win > 0) {
                      msg(p, "&6Частичный возврат: " + Fx.n(win) + " монет (x" + Fx.mult((double) win / s.bet) + ").");
                  } else {
                      msg(p, "&cПроигрыш: -" + Fx.n(s.bet) + " монет.");
                  }
                  if (credited < win) {
                      msg(p, "&eБаланс достиг максимума: зачислено " + Fx.n(credited) + " из " + Fx.n(win) + ".");
                  }
                  int annMult = getConfig().getInt("announce-multiplier", 50);
                  if (!s.free && annMult > 0 && s.bet > 0 && win >= s.bet * annMult) {
                      getServer().broadcastMessage(Fx.c("&6[Казино] &e" + nick + " выиграл &a" + Fx.n(win)
                              + " монет &e(x" + Fx.mult((double) win / s.bet) + ") в игре &f" + s.type.title + "&e!"));
                  }
              }

              /** Закрыть сессию: выплатить что причитается, убрать окно. Безопасно вызывать много раз. */
              void endSession(Session s) {
                  if (s.ended) {
                      return;
                  }
                  s.ended = true;
                  try {
                      settle(s, s.owed, "сессия завершена");
                  } catch (Throwable t) {
                      getLogger().warning("Ошибка выплаты: " + t);
                  }
                  Menu m = s.menu;
                  s.menu = null;
                  if (m != null) {
                      try {
                          s.player.removeWindow(m);
                      } catch (Throwable ignored) {
                          // игрок мог выйти
                      }
                      m.restore();
                  }
                  sessions.remove(s.key, s);
              }

              void menuOpened(Menu m) {
                  Session s = m.sess;
                  if (s.menu != m || s.ended) {
                      return;
                  }
                  s.menuOpened = true;
              }

              /** Игрок сам закрыл окно (или сервер закрыл). */
              void menuClosed(Menu m) {
                  Session s = m.sess;
                  if (s.menu != m) {
                      return;
                  }
                  s.menu = null;
                  s.ended = true;
                  try {
                      settle(s, s.owed, "окно закрыто");
                  } catch (Throwable t) {
                      getLogger().warning("Ошибка выплаты: " + t);
                  }
                  sessions.remove(s.key, s);
              }

              private void toMenu(Session s) {
                  final Player p = s.player;
                  endSession(s);
                  later(1, () -> {
                      if (p.isOnline()) {
                          openMain(p);
                      }
                  });
              }

              private void payPendingFor(String key) {
                  if (sessions.containsKey(key)) {
                      return;
                  }
                  long amt = store.getPending(key);
                  if (amt <= 0) {
                      store.clearPending(key);
                      return;
                  }
                  long credited = coins.give(key, amt, "казино: выплата после прерванной игры");
                  if (credited >= 0) {
                      store.clearPending(key);
                      Player p = online(key);
                      if (p != null && credited > 0) {
                          msg(p, "&aВыплата за прерванную игру: +" + Fx.n(credited) + " монет.");
                      }
                  }
              }

              private void payAllPending() {
                  for (String key : store.pendingCopy().keySet()) {
                      try {
                          payPendingFor(key);
                      } catch (Throwable t) {
                          getLogger().warning("Не удалось выплатить " + key + ": " + t);
                      }
                  }
              }

              // ====================================================================
              // События
              // ====================================================================

              @EventHandler(priority = EventPriority.HIGH)
              public void onTransaction(InventoryTransactionEvent e) {
                  InventoryTransaction tr = e.getTransaction();
                  Player p = tr.getSource();
                  if (p == null) {
                      return;
                  }
                  Session s = sessions.get(Coins.key(p.getName()));
                  if (s == null || s.menu == null) {
                      return;
                  }
                  boolean ours = false;
                  int slot = -1;
                  for (InventoryAction a : tr.getActions()) {
                      if (a instanceof SlotChangeAction) {
                          SlotChangeAction sa = (SlotChangeAction) a;
                          if (sa.getInventory() == s.menu) {
                              ours = true;
                              if (slot < 0) {
                                  slot = sa.getSlot();
                              }
                          }
                      }
                  }
                  if (!ours) {
                      return;
                  }
                  e.setCancelled(true); // ничего нельзя ни взять, ни положить, ни shift-кликнуть
                  if (slot >= 0) {
                      onClick(s, slot);
                  }
                  final Session fs = s;
                  later(1, () -> resync(fs));
              }

              /** Вернуть клиенту настоящее содержимое окна и инвентаря после отменённого клика. */
              private void resync(Session s) {
                  try {
                      if (s.menu != null && s.player.isOnline()) {
                          s.menu.sendContents(s.player);
                          s.player.getInventory().sendContents(s.player);
                      }
                  } catch (Throwable ignored) {
                      // не критично
                  }
              }

              @EventHandler
              public void onInvClose(InventoryCloseEvent e) {
                  Session s = sessions.get(Coins.key(e.getPlayer().getName()));
                  if (s != null && s.menu != null && e.getInventory() == s.menu) {
                      menuClosed(s.menu);
                  }
              }

              private void onClick(Session s, int slot) {
                  if (s.menu == null || !s.menuOpened || s.game == null || s.ended) {
                      return;
                  }
                  long now = System.currentTimeMillis();
                  if (now - s.lastClick < 150) {
                      return;
                  }
                  s.lastClick = now;
                  try {
                      if (s.settled) {
                          if (s.resultShown) {
                              if (slot == s.game.menuSlot()) {
                                  toMenu(s);
                              } else if (slot == s.game.replaySlot() && !s.free) {
                                  playAgain(s);
                              }
                          }
                          return;
                      }
                      s.game.click(slot);
                  } catch (Throwable t) {
                      getLogger().warning("Ошибка клика " + s.type + ": " + t);
                      endSession(s);
                  }
              }

              @EventHandler(priority = EventPriority.HIGH)
              public void onDrop(PlayerDropItemEvent e) {
                  Session s = sessions.get(Coins.key(e.getPlayer().getName()));
                  if (s != null && s.menu != null) {
                      e.setCancelled(true);
                  }
              }

              @EventHandler
              public void onJoin(PlayerJoinEvent e) {
                  final String key = Coins.key(e.getPlayer().getName());
                  if (store.getPending(key) > 0) {
                      later(60, () -> payPendingFor(key));
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  String key = Coins.key(e.getPlayer().getName());
                  forms.remove(key);
                  Session s = sessions.get(key);
                  if (s != null) {
                      endSession(s);
                  }
              }

              @EventHandler
              public void onForm(PlayerFormRespondedEvent e) {
                  Player p = e.getPlayer();
                  String key = Coins.key(p.getName());
                  FormCtx c = forms.get(key);
                  if (c == null || c.id != e.getFormID()) {
                      return;
                  }
                  forms.remove(key);
                  if (e.wasClosed() || e.getResponse() == null) {
                      return;
                  }
                  try {
                      c.handler.on(e.getResponse());
                  } catch (Throwable t) {
                      getLogger().warning("Ошибка формы: " + t);
                  }
              }

              // ====================================================================
              // Команды
              // ====================================================================

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  String name = command.getName().toLowerCase(Locale.ROOT);
                  if (name.equals("casino")) {
                      if (args.length > 0 && sender.hasPermission("casino.admin")) {
                          String sub = args[0].toLowerCase(Locale.ROOT);
                          if (sub.equals("stats")) {
                              showStats(sender);
                              return true;
                          }
                          if (sub.equals("top")) {
                              showTop(sender);
                              return true;
                          }
                          if (sub.equals("reload")) {
                              reloadConfig();
                              sender.sendMessage(Fx.c("&aКонфиг казино перезагружен."));
                              return true;
                          }
                      }
                      if (!(sender instanceof Player)) {
                          sender.sendMessage("Только для игроков. Админ-команды: /casino stats, /casino top, /casino reload");
                          return true;
                      }
                      openMain((Player) sender);
                      return true;
                  }
                  if (name.equals("spin")) {
                      if (!(sender instanceof Player)) {
                          sender.sendMessage("Только для игроков.");
                          return true;
                      }
                      Player p = (Player) sender;
                      String key = Coins.key(p.getName());
                      if (args.length >= 1) {
                          String in = args[0].replaceAll("[\\s_]", "");
                          if (!in.matches("\\d{1,9}")) {
                              msg(p, "&cИспользование: /spin [ставка " + minBet() + "-" + maxBet() + "]");
                              return true;
                          }
                          long bet = Long.parseLong(in);
                          if (bet < minBet() || bet > maxBet()) {
                              msg(p, "&cСтавка должна быть от " + Fx.n(minBet()) + " до " + Fx.n(maxBet()) + ".");
                              return true;
                          }
                          startRound(p, GameType.WHEEL, bet, 0, 0, false);
                      } else if (freeReady(key)) {
                          startRound(p, GameType.WHEEL, 0, 0, 0, true);
                      } else {
                          openBet(p, GameType.WHEEL, null);
                      }
                      return true;
                  }
                  return false;
              }

              private void showStats(CommandSender sender) {
                  Map<String, Store.GameStat> st = store.statsCopy();
                  sender.sendMessage(Fx.c("&6=== Казино: статистика ==="));
                  long w = 0;
                  long pd = 0;
                  long g = 0;
                  for (Map.Entry<String, Store.GameStat> e : st.entrySet()) {
                      Store.GameStat x = e.getValue();
                      String title = e.getKey().equals("FREE") ? "Бесплатные спины" : e.getKey();
                      String rtp = x.wagered > 0 ? String.format(Locale.ROOT, "%.1f%%", 100.0 * x.paid / x.wagered) : "-";
                      sender.sendMessage(Fx.c("&e" + title + "&f: игр " + x.games + ", ставки " + Fx.n(x.wagered)
                              + ", выплаты " + Fx.n(x.paid) + ", прибыль казино " + Fx.n(x.wagered - x.paid) + ", возврат " + rtp));
                      g += x.games;
                      w += x.wagered;
                      pd += x.paid;
                  }
                  sender.sendMessage(Fx.c("&6Итого&f: игр " + g + ", ставки " + Fx.n(w) + ", выплаты " + Fx.n(pd)
                          + ", прибыль казино &a" + Fx.n(w - pd)));
              }

              private void showTop(CommandSender sender) {
                  List<Store.Win> top = store.topCopy();
                  if (top.isEmpty()) {
                      sender.sendMessage(Fx.c("&7Выигрышей пока нет."));
                      return;
                  }
                  sender.sendMessage(Fx.c("&6=== Топ выигрышей ==="));
                  int i = 1;
                  for (Store.Win w : top) {
                      sender.sendMessage(Fx.c("&e" + i + ". &f" + w.player + " &7- &a" + Fx.n(w.win) + " &7(" + w.game
                              + ", ставка " + Fx.n(w.bet) + ")"));
                      i++;
                  }
              }

              // ====================================================================
              // Формы
              // ====================================================================

              /** Форма показывается через 0.5 сек (10 тиков) после действия: так клиент не теряет её. */
              private void showForm(final Player p, final FormWindow w, final FormHandler h) {
                  later(10, () -> {
                      if (!p.isOnline()) {
                          return;
                      }
                      try {
                          int id = p.showFormWindow(w);
                          forms.put(Coins.key(p.getName()), new FormCtx(id, h));
                      } catch (Throwable t) {
                          getLogger().warning("Не удалось показать форму: " + t);
                      }
                  });
              }

              private String balanceText(String key) {
                  long b = coins.balance(key);
                  return b < 0 ? "недоступен" : Fx.n(b);
              }

              private void openMain(final Player p) {
                  final String key = Coins.key(p.getName());
                  boolean free = freeReady(key);
                  FormWindowSimple f = new FormWindowSimple(Fx.c("&lКазино"),
                          Fx.c("&lВыбери игру\n\nТвой баланс: " + balanceText(key) + " монет\nСтавки: "
                                  + Fx.n(minBet()) + " - " + Fx.n(maxBet()) + " монет"));
                  final GameType[] ts = GameType.values();
                  for (GameType t : ts) {
                      f.addButton(new ElementButton(Fx.c("&0&l" + t.title)));
                  }
                  if (free) {
                      f.addButton(new ElementButton(Fx.c("&0&lБесплатный спин (доступен!)")));
                  }
                  showForm(p, f, r -> {
                      int id = ((FormResponseSimple) r).getClickedButtonId();
                      if (id >= 0 && id < ts.length) {
                          openRules(p, ts[id]);
                      } else if (id == ts.length) {
                          startRound(p, GameType.WHEEL, 0, 0, 0, true);
                      }
                  });
              }

              private String rules(GameType t) {
                  switch (t) {
                      case SLOTS:
                          return "&lСлоты\n\n3 барабана, платит средняя линия.\n\n"
