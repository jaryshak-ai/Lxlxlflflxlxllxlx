          package ru.eclips.casino;

          import cn.nukkit.item.Item;

          /**
           * Слоты: 3 барабана по 20 позиций, платит средняя линия.
           * Веса: вишня 8, лимон 5, колокол 4, алмаз 2, семёрка 1 (из 20).
           * Возврат игроку 93,0%. Считается точно: см. multPm.
           */
          final class SlotsGame extends Game {
              static final int[] WEIGHTS = {8, 5, 4, 2, 1};
              static final String[] NAMES = {"&c&lВишня", "&e&lЛимон", "&6&lКолокол", "&b&lАлмаз", "&d&lСемёрка"};
              static final String[] PLAIN = {"Вишня", "Лимон", "Колокол", "Алмаз", "Семёрка"};
              static final int[] IDS = {260, 371, 266, 264, 399};
              /** Выплата за три одинаковых, в тысячных долях ставки (x3, x10, x25, x80, x400). */
              static final long[] TRIPLE_PM = {3000, 10000, 25000, 80000, 400000};

              /** Множитель в тысячных долях ставки для комбинации средней линии. */
              static long multPm(int a, int b, int c) {
                  if (a == b && b == c) {
                      return TRIPLE_PM[a];
                  }
                  int cherries = (a == 0 ? 1 : 0) + (b == 0 ? 1 : 0) + (c == 0 ? 1 : 0);
                  if (cherries == 2) {
                      return 500;
                  }
                  if (cherries == 1) {
                      return 250;
                  }
                  return 0;
              }

              private final int[] stop = {14, 20, 26};
              private final int[][] grid = new int[3][3];
              private final int[][] feed = new int[3][];
              private final int[] res = new int[3];
              private int frame;
              private int wait;
              private int phase;
              private long win;

              SlotsGame(Casino plugin, Session s) {
                  super(plugin, s);
              }

              @Override
              long prepare() {
                  for (int r = 0; r < 3; r++) {
                      res[r] = Rng.weighted(WEIGHTS);
                  }
                  win = s.bet * multPm(res[0], res[1], res[2]) / 1000L;
                  s.played = true;
                  return win;
              }

              @Override
              void begin() {
                  paintBackground();
                  Menu m = menu();
                  for (int r = 0; r < 3; r++) {
                      feed[r] = new int[stop[r]];
                      for (int i = 0; i < stop[r]; i++) {
                          feed[r][i] = Rng.weighted(WEIGHTS);
                      }
                      // после последнего сдвига средняя клетка барабана = заранее выпавший символ
                      feed[r][stop[r] - 2] = res[r];
                      for (int row = 0; row < 3; row++) {
                          grid[r][row] = Rng.weighted(WEIGHTS);
                      }
                  }
                  m.setSlot(11, Fx.item(262, 0, "&e&l>>", "&7Платит средняя линия"));
                  m.setSlot(15, Fx.item(262, 0, "&e&l<<", "&7Платит средняя линия"));
                  m.setSlot(1, Fx.item(339, 0, "&e&lСтавка: " + Fx.n(s.bet), "&7Платит средняя линия"));
                  render();
                  frame = 0;
                  wait = 10;
                  phase = 1;
              }

              private Item sym(int i) {
                  return Fx.item(IDS[i], 0, NAMES[i]);
              }

              private void render() {
                  Menu m = menu();
                  if (m == null) {
                      return;
                  }
                  for (int r = 0; r < 3; r++) {
                      for (int row = 0; row < 3; row++) {
                          m.setSlot(row * 9 + 3 + r, sym(grid[r][row]));
                      }
                  }
              }

              @Override
              void tick() {
                  if (phase != 1) {
                      return;
                  }
                  if (--wait > 0) {
                      return;
                  }
                  frame++;
                  for (int r = 0; r < 3; r++) {
                      if (frame <= stop[r]) {
                          grid[r][2] = grid[r][1];
                          grid[r][1] = grid[r][0];
                          grid[r][0] = feed[r][frame - 1];
                      }
                  }
                  render();
                  Fx.sound(s.player, "RANDOM_CLICK", 1.2f);
                  if (frame >= stop[2]) {
                      phase = 2;
                      finish(win, "слоты: " + PLAIN[res[0]] + " / " + PLAIN[res[1]] + " / " + PLAIN[res[2]]);
                  } else {
                      wait = frame <= 20 ? 2 : (frame <= 24 ? 3 : 4);
                  }
              }

              @Override
              int infoSlot() {
                  return 1;
              }

              @Override
              int replaySlot() {
                  return 9;
              }

              @Override
              int menuSlot() {
                  return 17;
              }
          }
