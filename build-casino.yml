          package ru.eclips.casino;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.inventory.ContainerInventory;
          import cn.nukkit.inventory.Inventory;
          import cn.nukkit.inventory.InventoryHolder;
          import cn.nukkit.inventory.InventoryType;
          import cn.nukkit.item.Item;
          import cn.nukkit.level.Level;
          import cn.nukkit.math.Vector3;

          /**
           * Виртуальный сундук на 27 слотов. Игроку на 3 блока выше головы (только у него на экране)
           * рисуется сундук, и через него открывается окно. После закрытия там возвращается настоящий блок.
           * Все клики отменяет Casino.onTransaction.
           */
          final class Menu extends ContainerInventory {

              /** Владелец окна: точка + ссылка на инвентарь. */
              static final class Holder extends Vector3 implements InventoryHolder {
                  Inventory inv;

                  Holder(int x, int y, int z) {
                      super(x, y, z);
                  }

                  @Override
                  public Inventory getInventory() {
                      return inv;
                  }
              }

              final Casino plug;
              final Session sess;
              private final Level lvl;
              private final int bx;
              private final int by;
              private final int bz;
              private final String menuTitle;
              private boolean released;

              private Menu(Holder holder, Casino plug, Session sess, Level lvl, String menuTitle) {
                  super(holder, InventoryType.CHEST);
                  holder.inv = this;
                  this.plug = plug;
                  this.sess = sess;
                  this.lvl = lvl;
                  this.bx = holder.getFloorX();
                  this.by = holder.getFloorY();
                  this.bz = holder.getFloorZ();
                  this.menuTitle = menuTitle;
              }

              static Menu create(Casino plug, Session sess, String title) {
                  Player p = sess.player;
                  int x = p.getFloorX();
                  int z = p.getFloorZ();
                  int y = p.getFloorY() + 3;
                  if (y > 250) {
                      y = p.getFloorY() - 3;
                  }
                  if (y < 1) {
                      y = 1;
                  }
                  return new Menu(new Holder(x, y, z), plug, sess, p.getLevel(), title);
              }

              /** Нарисовать сундук и через 10 тиков открыть окно (клиенту нужно время принять блок). */
              void display() {
                  final Player p = sess.player;
                  try {
                      Block chest = Block.get(54, 2);
                      chest.x = bx;
                      chest.y = by;
                      chest.z = bz;
                      chest.level = lvl;
                      Fx.sendBlock(p, chest);
                      Fx.sendChestName(p, bx, by, bz, menuTitle);
                  } catch (Throwable ignored) {
                      // откроем и так
                  }
                  plug.later(10, () -> {
                      if (released || sess.ended || !p.isOnline()) {
                          return;
                      }
                      try {
                          sess.game.begin(); // предметы кладём ДО открытия окна (как в рабочем TopShop)
                          p.addWindow(this);
                      } catch (Throwable t) {
                          plug.getLogger().warning("Не удалось открыть сундук: " + t);
                          plug.endSession(sess);
                      }
                  });
              }

              /** Вернуть игроку настоящий блок на месте фейкового сундука. */
              void restore() {
                  if (released) {
                      return;
                  }
                  released = true;
                  try {
                      if (sess.player.isOnline()) {
                          Block real = lvl.getBlock(new Vector3(bx, by, bz));
                          Fx.sendBlock(sess.player, real);
                      }
                  } catch (Throwable ignored) {
                      // игрок мог выйти
                  }
              }

              @Override
              public void onOpen(Player who) {
                  super.onOpen(who);
                  plug.menuOpened(this);
              }

              @Override
              public void onClose(Player who) {
                  try {
                      super.onClose(who);
                  } catch (Throwable ignored) {
                      // игрок мог выйти
                  }
                  restore();
                  plug.menuClosed(this);
              }

              void setSlot(int slot, Item item) {
                  try {
                      setItem(slot, item);
                  } catch (Throwable ignored) {
                      // слот не критичен
                  }
              }

              void paintAll() {
                  for (int i = 0; i < 27; i++) {
                      setSlot(i, Fx.filler());
                  }
              }
          }
