          mkdir -p "$(dirname 'Casino/src/main/java/ru/eclips/casino/RouletteGame.java')"
          cat > 'Casino/src/main/java/ru/eclips/casino/RouletteGame.java' << 'CASINO_EOF'
          package ru.eclips.casino;

          /**
           * Европейская рулетка (37 ячеек, один ноль). Ноль забирает все ставки, кроме ставки на 0.
           * Любая ставка отдаёт игроку 36/37 = 97,30%.
           */
          final class RouletteGame extends Game {
              /** Реальный порядок ячеек на колесе. */
              static final int[] WHEEL = {0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1,
                      20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26};
              static final boolean[] RED = new boolean[37];

              static {
                  for (int n : new int[]{1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36}) {
                      RED[n] = true;
                  }
              }

              static final String[] KINDS = {
                      "Красное (x2)", "Чёрное (x2)", "Чётное (x2)", "Нечётное (x2)", "1-18 (x2)", "19-36 (x2)",
                      "1-я дюжина 1-12 (x3)", "2-я дюжина 13-24 (x3)", "3-я дюжина 25-36 (x3)",
                      "1-я колонка (x3)", "2-я колонка (x3)", "3-я колонка (x3)", "Число (x36)"};

              static int payMult(int kind) {
                  return kind <= 5 ? 2 : (kind <= 11 ? 3 : 36);
              }

              static boolean wins(int kind, int num, int r) {
                  if (kind == 12) {
                      return r == num;
                  }
                  if (r == 0) {
                      return false;
                  }
                  switch (kind) {
                      case 0:
                          return RED[r];
                      case 1:
                          return !RED[r];
                      case 2:
                          return r % 2 == 0;
                      case 3:
                          return r % 2 == 1;
                      case 4:
                          return r <= 18;
                      case 5:
                          return r >= 19;
                      case 6:
                          return r <= 12;
                      case 7:
                          return r >= 13 && r <= 24;
                      case 8:
                          return r >= 25;
                      case 9:
                          return r % 3 == 1;
                      case 10:
                          return r % 3 == 2;
                      case 11:
                          return r % 3 == 0;
                      default:
                          return false;
                  }
              }

              private int result;
              private long win;
              private int center;
              private int total;
              private int step;
              private int wait;
              private int phase;

              RouletteGame(Casino plugin, Session s) {
                  super(plugin, s);
              }

              @Override
              long prepare() {
                  result = Rng.next(37);
                  win = wins(s.rouletteKind, s.rouletteNumber, result) ? s.bet * payMult(s.rouletteKind) : 0;
                  s.played = true;
                  return win;
              }

              @Override
              void begin() {
                  paintBackground();
                  Menu m = menu();
                  String what = KINDS[s.rouletteKind] + (s.rouletteKind == 12 ? ": " + s.rouletteNumber : "");
                  m.setSlot(0, Fx.item(339, 0, "&e&lСтавка: " + Fx.n(s.bet), "&7" + what));
                  m.setSlot(4, Fx.item(262, 0, "&e&lv", "&7Сюда выпадет число"));
                  m.setSlot(22, Fx.item(262, 0, "&e&l^", "&7Сюда выпадет число"));
                  int idxWin = 0;
                  for (int i = 0; i < 37; i++) {
                      if (WHEEL[i] == result) {
                          idxWin = i;
                      }
                  }
                  center = Rng.next(37);
                  total = 37 + ((idxWin - center) % 37 + 37) % 37;
                  step = 0;
                  wait = 8;
                  phase = 1;
                  render();
              }

              private void render() {
                  Menu m = menu();
                  if (m == null) {
                      return;
                  }
                  for (int d = -4; d <= 4; d++) {
                      int num = WHEEL[((center + d) % 37 + 37) % 37];
                      int color = num == 0 ? 5 : (RED[num] ? 14 : 15);
                      String name = (num == 0 ? "&a&l" : (RED[num] ? "&c&l" : "&7&l")) + num;
                      m.setSlot(13 + d, Fx.wool(color, name));
                  }
              }

              @Override
              void tick() {
                  if (phase != 1) {
                      return;
                  }
                  if (--wait > 0) {
                      return;
                  }
                  step++;
                  center = (center + 1) % 37;
                  render();
                  Fx.sound(s.player, "RANDOM_CLICK", 1.0f);
                  int rem = total - step;
                  if (rem <= 0) {
                      phase = 2;
                      String col = result == 0 ? "зелёное" : (RED[result] ? "красное" : "чёрное");
                      finish(win, "рулетка: выпало " + result + " (" + col + "), ставка " + KINDS[s.rouletteKind]
                              + (s.rouletteKind == 12 ? " " + s.rouletteNumber : ""));
                  } else {
                      wait = rem > 30 ? 1 : (rem > 16 ? 2 : (rem > 8 ? 3 : (rem > 3 ? 5 : 8)));
                  }
              }

              @Override
              int infoSlot() {
                  return 22;
              }

              @Override
              int replaySlot() {
                  return 20;
              }

              @Override
              int menuSlot() {
                  return 24;
              }
          }
