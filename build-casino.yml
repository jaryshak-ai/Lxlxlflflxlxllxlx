          cat > 'Casino/src/main/java/ru/eclips/casino/MinesGame.java' << 'CASINO_EOF'
          package ru.eclips.casino;

          /**
           * Мины: поле 21 клетка (3 ряда по 7), мин от 1 до 20. Раскладка мин решается на сервере в начале раунда.
           * Множитель после k безопасных клеток: rtp * C(21,k) / C(21-m,k), rtp = 0.95 (настраивается).
           * Это честный коэффициент с долей казино 5%, при любой стратегии возврат 95%.
           */
          final class MinesGame extends Game {
              static final int CELLS = 21;
              private static final int[] CASH_SLOTS = {8, 17, 26};

              private final boolean[] mine = new boolean[CELLS];
              private final boolean[] open = new boolean[CELLS];
              private int m;
              private int k;
              private double rtp;

              MinesGame(Casino plugin, Session s) {
                  super(plugin, s);
              }

              /** Множитель при k открытых безопасных клетках. */
              static double multiplier(double rtp, int mines, int safeOpened) {
                  double v = rtp;
                  for (int i = 0; i < safeOpened; i++) {
                      v *= (double) (CELLS - i) / (double) (CELLS - mines - i);
                  }
                  return v;
              }

              private long payout(int safe) {
                  return (long) Math.floor(s.bet * multiplier(rtp, m, safe));
              }

              @Override
              long prepare() {
                  rtp = plugin.getConfig().getDouble("mines-rtp", 0.95);
                  m = Math.max(1, Math.min(CELLS - 1, s.minesCount));
                  int placed = 0;
                  while (placed < m) {
                      int c = Rng.next(CELLS);
                      if (!mine[c]) {
                          mine[c] = true;
                          placed++;
                      }
                  }
                  return s.bet; // пока ничего не открыл - ставка возвращается
              }

              private static int slotOf(int cell) {
                  return (cell / 7) * 9 + 1 + (cell % 7);
              }

              private static int cellOf(int slot) {
                  int row = slot / 9;
                  int col = slot % 9;
                  if (row > 2 || col < 1 || col > 7) {
                      return -1;
                  }
                  return row * 7 + (col - 1);
              }

              @Override
              void begin() {
                  paintBackground();
                  for (int c = 0; c < CELLS; c++) {
                      menu().setSlot(slotOf(c), Fx.pane(3, "&b&lКлетка", "&7Нажми, чтобы открыть"));
                  }
                  refresh();
              }

              private void refresh() {
                  Menu mn = menu();
                  if (mn == null || s.settled) {
                      return;
                  }
                  mn.setSlot(0, Fx.item(339, 0, "&e&lСтавка: " + Fx.n(s.bet), "&7Мин на поле: " + m));
                  mn.setSlot(9, Fx.item(339, 0, "&e&lОткрыто: " + k + " из " + (CELLS - m),
                          k == 0 ? "&7Если закроешь окно, ставка вернётся" : "&7Закроешь окно - выигрыш заберётся сам"));
                  mn.setSlot(18, Fx.item(339, 0, "&e&lСледующая клетка: x" + Fx.mult(multiplier(rtp, m, k + 1)),
                          "&7Сейчас: x" + Fx.mult(k == 0 ? 1.0 : multiplier(rtp, m, k))));
                  for (int slot : CASH_SLOTS) {
                      if (k == 0) {
                          mn.setSlot(slot, Fx.filler());
                      } else {
                          mn.setSlot(slot, Fx.item(41, 0, "&a&lЗАБРАТЬ " + Fx.n(payout(k)),
                                  "&7Множитель: x" + Fx.mult(multiplier(rtp, m, k)), "&7Нажми, чтобы забрать выигрыш"));
                      }
                  }
              }

              @Override
              void click(int slot) {
                  if (s.settled) {
                      return;
                  }
                  for (int cs : CASH_SLOTS) {
                      if (slot == cs) {
                          if (k > 0) {
                              cashOut();
                          }
                          return;
                      }
                  }
                  int c = cellOf(slot);
                  if (c < 0 || open[c]) {
                      return;
                  }
                  s.played = true;
                  open[c] = true;
                  if (mine[c]) {
                      revealAll(c);
                      Fx.sound(s.player, "RANDOM_EXPLODE", 1f);
                      finish(0, "мины (" + m + "): подорвался на " + (k + 1) + "-й клетке");
                      return;
                  }
                  k++;
                  plugin.setOwed(s, payout(k));
                  menu().setSlot(slotOf(c), Fx.item(388, 0, "&a&lБезопасно", "&7x" + Fx.mult(multiplier(rtp, m, k))));
                  Fx.sound(s.player, "RANDOM_ORB", 1f);
                  if (k >= CELLS - m) {
                      cashOut();
                  } else {
                      refresh();
                  }
              }

              private void cashOut() {
                  revealAll(-1);
                  long win = payout(k);
                  if (k == 0) {
                      s.played = false;
                      win = s.bet;
                  }
                  finish(win, "мины (" + m + "): открыто " + k + ", забрал");
              }

              private void revealAll(int boomCell) {
                  Menu mn = menu();
                  if (mn == null) {
                      return;
                  }
                  for (int c = 0; c < CELLS; c++) {
                      if (mine[c]) {
                          mn.setSlot(slotOf(c), Fx.item(46, 0, c == boomCell ? "&c&lМИНА! (ты тут)" : "&c&lМина"));
                      } else if (!open[c]) {
                          mn.setSlot(slotOf(c), Fx.pane(7, "&7Безопасно"));
                      }
                  }
              }

              @Override
              void decorateResult() {
                  Menu mn = menu();
                  if (mn == null) {
                      return;
                  }
                  mn.setSlot(8, Fx.filler());
                  mn.setSlot(9, Fx.filler());
                  mn.setSlot(18, Fx.filler());
                  mn.setSlot(26, Fx.filler());
              }

              @Override
              int infoSlot() {
                  return 0;
              }

              @Override
              int replaySlot() {
                  return 9;
              }

              @Override
              int menuSlot() {
                  return 17;
              }
          }
          CASINO_EOF
