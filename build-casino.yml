              private void openRules(final Player p, final GameType t) {
                  FormWindowSimple f = new FormWindowSimple(Fx.c("&l" + t.title), Fx.c(rules(t)));
                  f.addButton(new ElementButton(Fx.c("&0&lСделать ставку")));
                  f.addButton(new ElementButton(Fx.c("&0&lНазад")));
                  showForm(p, f, r -> {
                      int id = ((FormResponseSimple) r).getClickedButtonId();
                      if (id == 0) {
                          openBet(p, t, null);
                      } else {
                          openMain(p);
                      }
                  });
