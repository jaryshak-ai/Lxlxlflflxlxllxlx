          package ru.eclips.casino;

          /**
           * 3 сундука: приз лежит в одном (выбирает сервер заранее). Выплата x2.85 (настраивается),
           * шанс 1/3 -> возврат игроку 95%. Если закрыть окно до выбора, ставка возвращается.
           */
          final class ChestsGame extends Game {
              private static final int[] SLOTS = {11, 13, 15};

              private int prize;
              private int pick = -1;
              private int phase;
              private int wait;
              private long win;
              private long mult1000;

              ChestsGame(Casino plugin, Session s) {
                  super(plugin, s);
              }

              @Override
              long prepare() {
                  prize = Rng.next(3);
                  mult1000 = Math.round(plugin.getConfig().getDouble("chests-multiplier", 2.85) * 1000.0);
                  return s.bet; // пока не выбрал - ставка возвращается
              }

              @Override
              void begin() {
                  paintBackground();
                  Menu m = menu();
                  m.setSlot(4, Fx.item(339, 0, "&e&lСтавка: " + Fx.n(s.bet),
                          "&7Приз в одном из трёх сундуков", "&7Выигрыш: x" + Fx.mult(mult1000 / 1000.0)));
                  for (int i = 0; i < 3; i++) {
                      m.setSlot(SLOTS[i], Fx.item(54, 0, "&6&lСундук " + (i + 1), "&7Нажми, чтобы открыть"));
                  }
                  m.setSlot(22, Fx.item(339, 0, "&e&lВыбери сундук", "&7Если закроешь окно, ставка вернётся"));
                  phase = 0;
              }

              @Override
              void click(int slot) {
                  if (phase != 0) {
                      return;
                  }
                  for (int i = 0; i < 3; i++) {
                      if (slot == SLOTS[i]) {
                          pick = i;
                          phase = 1;
                          s.played = true;
                          win = i == prize ? s.bet * mult1000 / 1000L : 0;
                          plugin.setOwed(s, win);
                          menu().setSlot(22, Fx.filler());
                          reveal(i, i == prize);
                          Fx.sound(s.player, "RANDOM_CLICK", 1f);
                          wait = 15;
                          return;
                      }
                  }
              }

              private void reveal(int i, boolean isPrize) {
                  Menu m = menu();
                  if (m == null) {
                      return;
                  }
                  if (isPrize) {
                      m.setSlot(SLOTS[i], Fx.item(41, 0, "&a&lПРИЗ!", "&7Выигрыш: x" + Fx.mult(mult1000 / 1000.0)));
                  } else {
                      m.setSlot(SLOTS[i], Fx.item(173, 0, "&c&lПусто"));
                  }
              }

              @Override
              void tick() {
                  if (phase == 1) {
                      if (--wait > 0) {
                          return;
                      }
                      for (int i = 0; i < 3; i++) {
                          if (i != pick) {
                              reveal(i, i == prize);
                          }
                      }
                      Fx.sound(s.player, "RANDOM_CLICK", 0.8f);
                      phase = 2;
                      wait = 12;
                  } else if (phase == 2) {
                      if (--wait > 0) {
                          return;
                      }
                      phase = 3;
                      finish(win, "3 сундука: выбран " + (pick + 1) + ", приз был в " + (prize + 1));
                  }
              }

              @Override
              int infoSlot() {
                  return 4;
              }

              @Override
              int replaySlot() {
                  return 20;
              }

              @Override
              int menuSlot() {
                  return 24;
              }
          }
