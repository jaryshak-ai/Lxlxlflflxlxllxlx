          cat > 'Casino/src/main/java/ru/eclips/casino/Store.java' << 'CASINO_EOF'
          package ru.eclips.casino;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.google.gson.reflect.TypeToken;

          import java.io.File;
          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.lang.reflect.Type;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.AtomicMoveNotSupportedException;
          import java.nio.file.Files;
          import java.nio.file.StandardCopyOption;
          import java.nio.file.StandardOpenOption;
          import java.time.LocalDate;
          import java.time.LocalDateTime;
          import java.time.format.DateTimeFormatter;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.TimeUnit;

          /**
           * Хранилище на диске:
           *  - pending.json: сколько монет причитается игроку по незавершённым играм (выплата после краша/выхода);
           *  - data.json: статистика казино, топ выигрышей, время последнего бесплатного спина;
           *  - logs/casino-ГГГГ-ММ-ДД.log: лог каждой игры (пишется в отдельном потоке).
           */
          final class Store {
              static final class GameStat {
                  long games;
                  long wagered;
                  long paid;
              }

              static final class Win {
                  String player;
                  String game;
                  long bet;
                  long win;
                  long time;
              }

              static final class Data {
                  Map<String, GameStat> games = new LinkedHashMap<>();
                  List<Win> top = new ArrayList<>();
                  Map<String, Long> freeSpin = new HashMap<>();
              }

              private static final Type PENDING_TYPE = new TypeToken<Map<String, Long>>() { }.getType();
              private static final DateTimeFormatter TIME = DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss");

              private final Casino plugin;
              private final File dataFile;
              private final File pendingFile;
              private final File logDir;
              private final Gson gson = new GsonBuilder().setPrettyPrinting().create();
              private final Map<String, Long> pending = new HashMap<>();
              private Data data = new Data();
              private boolean dirty;
              private final ExecutorService logExec = Executors.newSingleThreadExecutor(r -> {
                  Thread t = new Thread(r, "Casino-log");
                  t.setDaemon(true);
                  return t;
              });

              Store(Casino plugin, int keepDays) {
                  this.plugin = plugin;
                  this.dataFile = new File(plugin.getDataFolder(), "data.json");
                  this.pendingFile = new File(plugin.getDataFolder(), "pending.json");
                  this.logDir = new File(plugin.getDataFolder(), "logs");
                  plugin.getDataFolder().mkdirs();
                  logDir.mkdirs();
                  load();
                  cleanupLogs(Math.max(1, keepDays));
              }

              // ---------- pending ----------

              synchronized void setPending(String key, long amount) {
                  pending.put(key, amount);
                  writeFile(pendingFile, pending, PENDING_TYPE);
              }

              synchronized void clearPending(String key) {
                  if (pending.remove(key) != null) {
                      writeFile(pendingFile, pending, PENDING_TYPE);
                  }
              }

              synchronized long getPending(String key) {
                  Long v = pending.get(key);
                  return v == null ? 0 : v;
              }

              synchronized Map<String, Long> pendingCopy() {
                  return new HashMap<>(pending);
              }

              // ---------- бесплатный спин ----------

              synchronized long lastFree(String key) {
                  Long v = data.freeSpin.get(key);
                  return v == null ? 0 : v;
              }

              synchronized void markFree(String key, long time) {
                  data.freeSpin.put(key, time);
                  writeFile(dataFile, data, Data.class);
                  dirty = false;
              }

              // ---------- статистика ----------

              synchronized void record(String gameKey, long bet, long paid) {
                  GameStat g = data.games.computeIfAbsent(gameKey, k -> new GameStat());
                  g.games++;
                  g.wagered += bet;
                  g.paid += paid;
                  dirty = true;
              }

              synchronized void addTop(String player, String game, long bet, long win) {
                  if (win <= 0) {
                      return;
                  }
                  Win w = new Win();
                  w.player = player;
                  w.game = game;
                  w.bet = bet;
                  w.win = win;
                  w.time = System.currentTimeMillis();
                  data.top.add(w);
                  data.top.sort((a, b) -> Long.compare(b.win, a.win));
                  while (data.top.size() > 10) {
                      data.top.remove(data.top.size() - 1);
                  }
                  dirty = true;
              }

              synchronized Map<String, GameStat> statsCopy() {
                  Map<String, GameStat> copy = new LinkedHashMap<>();
                  for (Map.Entry<String, GameStat> e : data.games.entrySet()) {
                      GameStat g = new GameStat();
                      g.games = e.getValue().games;
                      g.wagered = e.getValue().wagered;
                      g.paid = e.getValue().paid;
                      copy.put(e.getKey(), g);
                  }
                  return copy;
              }

              synchronized List<Win> topCopy() {
                  return new ArrayList<>(data.top);
              }

              synchronized void saveStats() {
                  if (dirty) {
                      writeFile(dataFile, data, Data.class);
                      dirty = false;
                  }
              }

              // ---------- лог ----------

              void log(String nick, String game, long bet, long win, String detail) {
                  final String line = "[" + TIME.format(LocalDateTime.now()) + "] " + nick + " | " + game
                          + " | ставка " + bet + " | выплата " + win + " | " + detail + System.lineSeparator();
                  final File f = new File(logDir, "casino-" + LocalDate.now() + ".log");
                  try {
                      logExec.execute(() -> {
                          try {
                              Files.write(f.toPath(), line.getBytes(StandardCharsets.UTF_8),
                                      StandardOpenOption.CREATE, StandardOpenOption.APPEND);
                          } catch (IOException ignored) {
                              // лог не критичен
                          }
                      });
                  } catch (RuntimeException ignored) {
                      // пул уже закрыт
                  }
              }

              void shutdown() {
                  saveStats();
                  logExec.shutdown();
                  try {
                      logExec.awaitTermination(3, TimeUnit.SECONDS);
                  } catch (InterruptedException ignored) {
                      Thread.currentThread().interrupt();
                  }
              }

              // ---------- внутреннее ----------

              private void cleanupLogs(int keepDays) {
                  File[] files = logDir.listFiles();
                  if (files == null) {
                      return;
                  }
                  LocalDate limit = LocalDate.now().minusDays(keepDays);
                  for (File f : files) {
                      String n = f.getName();
                      if (!n.startsWith("casino-") || !n.endsWith(".log")) {
                          continue;
                      }
                      try {
                          LocalDate d = LocalDate.parse(n.substring(7, n.length() - 4));
                          if (d.isBefore(limit)) {
                              f.delete();
                          }
                      } catch (RuntimeException ignored) {
                          // чужой файл - не трогаем
                      }
                  }
              }

              private void load() {
                  if (pendingFile.exists()) {
                      try (Reader r = Files.newBufferedReader(pendingFile.toPath(), StandardCharsets.UTF_8)) {
                          Map<String, Long> m = gson.fromJson(r, PENDING_TYPE);
                          if (m != null) {
                              pending.putAll(m);
                          }
                      } catch (Exception e) {
                          plugin.getLogger().error("pending.json повреждён: " + e.getMessage());
                          backup(pendingFile);
                      }
                  }
                  if (dataFile.exists()) {
                      try (Reader r = Files.newBufferedReader(dataFile.toPath(), StandardCharsets.UTF_8)) {
                          Data d = gson.fromJson(r, Data.class);
                          if (d != null) {
                              if (d.games == null) {
                                  d.games = new LinkedHashMap<>();
                              }
                              if (d.top == null) {
                                  d.top = new ArrayList<>();
                              }
                              if (d.freeSpin == null) {
                                  d.freeSpin = new HashMap<>();
                              }
                              data = d;
                          }
                      } catch (Exception e) {
                          plugin.getLogger().error("data.json повреждён: " + e.getMessage());
                          backup(dataFile);
                      }
                  }
              }

              private void backup(File f) {
                  try {
                      Files.copy(f.toPath(), new File(f.getParentFile(), f.getName() + ".broken-" + System.currentTimeMillis()).toPath());
                  } catch (IOException ignored) {
                      // нечего делать
                  }
              }

              private void writeFile(File target, Object obj, Type type) {
                  File tmp = new File(target.getParentFile(), target.getName() + ".tmp");
                  try (Writer w = Files.newBufferedWriter(tmp.toPath(), StandardCharsets.UTF_8)) {
                      gson.toJson(obj, type, w);
                  } catch (IOException e) {
                      plugin.getLogger().error("Не удалось сохранить " + target.getName() + ": " + e.getMessage());
                      return;
                  }
                  try {
                      Files.move(tmp.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING, StandardCopyOption.ATOMIC_MOVE);
                  } catch (AtomicMoveNotSupportedException e) {
                      try {
                          Files.move(tmp.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING);
                      } catch (IOException e2) {
                          plugin.getLogger().error("Не удалось сохранить " + target.getName() + ": " + e2.getMessage());
                      }
                  } catch (IOException e) {
                      plugin.getLogger().error("Не удалось сохранить " + target.getName() + ": " + e.getMessage());
                  }
              }
          }
          CASINO_EOF
          mkdir -p "$(dirname 'Casino/src/main/java/ru/eclips/casino/WheelGame.java')"
          cat > 'Casino/src/main/java/ru/eclips/casino/WheelGame.java' << 'CASINO_EOF'
          package ru.eclips.casino;

          import cn.nukkit.item.Item;

          import java.util.List;

          /**
           * Колесо фортуны: 20 секторов по кольцу из ячеек сундука.
           * Платное: x0 (7 секторов), x0.5 (5), x1 (4), x2 (2), x3 (1), x5 (1) -> возврат 18.5/20 = 92,5%.
           * Бесплатный спин (раз в сутки): призы из config.yml (по умолчанию 1000-5000).
           */
          final class WheelGame extends Game {
              /** Ячейки кольца по часовой стрелке: верх слева направо, правый бок, низ справа налево, левый бок. */
              static final int[] RING = {0, 1, 2, 3, 4, 5, 6, 7, 8, 17, 26, 25, 24, 23, 22, 21, 20, 19, 18, 9};
              /** Множители секторов в десятых долях (5 = x0.5). Порядок разложен так, что одинаковые не стоят рядом. */
              static final int[] SECT = {0, 10, 0, 5, 0, 20, 0, 10, 5, 30, 0, 5, 10, 0, 50, 5, 0, 10, 20, 5};
              static final int[] DEFAULT_PRIZES = {1000, 2000, 1000, 1500, 1000, 3000, 1000, 2000, 1500, 5000,
                      1000, 1500, 2500, 1000, 4000, 1500, 1000, 2500, 2000, 1000};

              private final int[] vals = new int[20];
              private int winIdx;
              private long win;
              private int pos;
              private int total;
              private int step;
              private int wait;
              private int phase;
              private int blink;

              WheelGame(Casino plugin, Session s) {
                  super(plugin, s);
              }

              @Override
              long prepare() {
                  if (s.free) {
                      int[] prizes = freePrizes(plugin);
                      System.arraycopy(prizes, 0, vals, 0, 20);
                  } else {
                      System.arraycopy(SECT, 0, vals, 0, 20);
                  }
                  winIdx = Rng.next(20);
                  win = s.free ? vals[winIdx] : s.bet * vals[winIdx] / 10L;
                  s.played = true;
                  return win;
              }

              static int[] freePrizes(Casino plugin) {
                  int[] out = new int[20];
                  try {
                      List<Integer> list = plugin.getConfig().getIntegerList("free-spin-prizes");
                      if (list != null && list.size() == 20) {
                          for (int i = 0; i < 20; i++) {
                              out[i] = Math.max(0, list.get(i));
                          }
                          return out;
                      }
                  } catch (Throwable ignored) {
                      // берём значения по умолчанию
                  }
                  System.arraycopy(DEFAULT_PRIZES, 0, out, 0, 20);
                  return out;
              }

              private int color(int i) {
                  int v = vals[i];
                  if (!s.free) {
                      switch (v) {
                          case 0:
                              return 14;
                          case 5:
                              return 1;
                          case 10:
                              return 4;
                          case 20:
                              return 5;
                          case 30:
                              return 3;
                          default:
                              return 10;
                      }
                  }
                  if (v <= 1000) {
                      return 4;
                  }
                  if (v <= 1500) {
                      return 1;
                  }
                  if (v <= 2000) {
                      return 5;
                  }
                  if (v <= 2500) {
                      return 9;
                  }
                  if (v <= 3000) {
                      return 3;
                  }
                  if (v <= 4000) {
                      return 10;
                  }
                  return 2;
              }

              private String label(int i) {
                  int v = vals[i];
                  if (s.free) {
                      return "&l+" + Fx.n(v);
                  }
                  return "&lx" + (v % 10 == 0 ? String.valueOf(v / 10) : (v / 10) + "." + (v % 10));
              }

              private void cell(int i, boolean hot) {
                  Menu m = menu();
                  if (m == null) {
                      return;
                  }
                  Item it = hot ? Fx.wool(color(i), "&e>> " + label(i) + " &e<<") : Fx.pane(color(i), label(i));
                  m.setSlot(RING[i], it);
              }

              @Override
              void begin() {
                  paintBackground();
                  Menu m = menu();
                  if (s.free) {
                      m.setSlot(13, Fx.item(339, 0, "&e&lБесплатный спин", "&7Приз: 1000-5000 монет"));
                  } else {
                      m.setSlot(13, Fx.item(339, 0, "&e&lСтавка: " + Fx.n(s.bet), "&7Колесо фортуны"));
                  }
                  pos = Rng.next(20);
                  for (int i = 0; i < 20; i++) {
                      cell(i, i == pos);
                  }
                  total = 40 + ((winIdx - pos) % 20 + 20) % 20;
                  step = 0;
                  wait = 10;
                  blink = 0;
                  phase = 1;
              }

              @Override
              void tick() {
                  if (phase == 1) {
                      if (--wait > 0) {
                          return;
                      }
                      step++;
                      int old = pos;
                      pos = (pos + 1) % 20;
                      cell(old, false);
                      cell(pos, true);
                      Fx.sound(s.player, "RANDOM_CLICK", 1.0f);
                      int rem = total - step;
                      if (rem <= 0) {
                          phase = 2;
                          wait = 4;
                      } else {
                          wait = rem > 24 ? 1 : (rem > 14 ? 2 : (rem > 7 ? 3 : (rem > 3 ? 5 : 8)));
                      }
                  } else if (phase == 2) {
                      if (--wait > 0) {
                          return;
                      }
                      blink++;
                      cell(winIdx, blink % 2 == 1 ? false : true);
                      wait = 4;
                      if (blink >= 7) {
                          cell(winIdx, true);
                          phase = 3;
                          finish(win, s.free ? "бесплатный спин: приз " + win
                                  : "колесо: сектор " + label(winIdx).replace("&l", ""));
                      }
                  }
              }

              @Override
              void decorateResult() {
                  // центр кольца свободен под итоговые кнопки
                  Menu m = menu();
                  if (m != null) {
                      m.setSlot(13, Fx.filler());
                  }
              }

              @Override
              int infoSlot() {
                  return 13;
              }

              @Override
              int replaySlot() {
                  return 11;
              }

              @Override
              int menuSlot() {
                  return 15;
              }
          }
          CASINO_EOF
          mkdir -p "$(dirname 'Casino/src/main/resources/config.yml')"
          cat > 'Casino/src/main/resources/config.yml' << 'CASINO_EOF'
          # Casino config. Цвета: & + код (&a, &c, &e ...)
          # После обновления плагина удали старый config.yml, чтобы появились новые ключи.
          # Валюта: монеты TpCoins (плагин TpCoins обязателен).

          # Префикс сообщений казино в чате
          prefix: "&6[Казино]&r "

          # Минимальная и максимальная ставка (монет)
          min-bet: 500
          max-bet: 50000

          # Пауза между играми одного игрока, секунд
          cooldown-seconds: 3

          # Выигрыш от этого множителя объявляется всему серверу в чате (0 = не объявлять)
          announce-multiplier: 50

          # Миры, где казино запрещено (имя или папка мира). Пример: ["world_nether", "5"]
          disabled-worlds: []

          # Мины: возврат игроку (0.95 = 95%, доля казино 5%)
          mines-rtp: 0.95

          # 3 сундука: множитель выигрыша. Шанс 1/3, значит 2.85 даёт возврат 95%
          chests-multiplier: 2.85

          # Бесплатный спин: раз в сколько часов можно
          free-spin-hours: 24
          # Призы бесплатного спина: ровно 20 секторов колеса (повтор значения = выше шанс).
          # По умолчанию среднее 1850 монет, диапазон 1000-5000.
          free-spin-prizes: [1000, 2000, 1000, 1500, 1000, 3000, 1000, 2000, 1500, 5000, 1000, 1500, 2500, 1000, 4000, 1500, 1000, 2500, 2000, 1000]

          # Сколько дней хранить логи игр (plugins/Casino/logs/)
          log-keep-days: 30
          CASINO_EOF
          mkdir -p "$(dirname 'Casino/src/main/resources/plugin.yml')"
          cat > 'Casino/src/main/resources/plugin.yml' << 'CASINO_EOF'
          name: Casino
          main: ru.eclips.casino.Casino
          version: "1.0.1"
          api: ["1.0.0"]
          author: Eclips
          depend: [TpCoins]
          description: Casino - slots, mines, roulette, 3 chests, wheel (coins from TpCoins)

          commands:
            casino:
              description: Открыть казино
              usage: "/casino"
              permission: casino.use
            spin:
              description: Бесплатный спин колеса или быстрая ставка
              usage: "/spin [ставка]"
              permission: casino.use

          permissions:
            casino.use:
              description: Play in the casino (/casino, /spin)
              default: "true"
            casino.admin:
              description: Casino admin commands (/casino stats, top, reload)
              default: op
          CASINO_EOF
      - name: Build
        run: mvn -B clean package
        working-directory: Casino
      - uses: actions/upload-artifact@v4
        with:
          name: Casino-jar
          path: Casino/target/Casino-1.0.1.jar
