          package ru.eclips.casino;

          import cn.nukkit.plugin.Plugin;

          import java.lang.reflect.Method;
          import java.util.Locale;

          /**
           * Мост к экономике TpCoins через рефлексию (без compile-зависимости от чужого jar).
           * Используются методы EconomyManager: getBalance, withdraw, deposit, getRoom.
           */
          final class Coins {
              private final Casino plugin;
              private Object eco;
              private Method mBalance;
              private Method mWithdraw;
              private Method mDeposit;
              private Method mRoom;

              Coins(Casino plugin) {
                  this.plugin = plugin;
                  init();
              }

              /** Ключ аккаунта TpCoins: нижний регистр, пробелы -> подчёркивания. */
              static String key(String name) {
                  return name.trim().toLowerCase(Locale.ROOT).replace(' ', '_');
              }

              synchronized boolean init() {
                  if (eco != null) {
                      return true;
                  }
                  try {
                      Plugin tp = plugin.getServer().getPluginManager().getPlugin("TpCoins");
                      if (tp == null) {
                          return false;
                      }
                      Object e = tp.getClass().getMethod("getEconomy").invoke(tp);
                      if (e == null) {
                          return false;
                      }
                      Class<?> c = e.getClass();
                      mBalance = c.getMethod("getBalance", String.class);
                      mWithdraw = c.getMethod("withdraw", String.class, long.class, String.class);
                      mDeposit = c.getMethod("deposit", String.class, long.class, String.class);
                      mRoom = c.getMethod("getRoom", String.class);
                      eco = e;
                      return true;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /** Баланс или -1, если экономика недоступна. */
              synchronized long balance(String key) {
                  if (!init()) {
                      return -1;
                  }
                  try {
                      return ((Number) mBalance.invoke(eco, key)).longValue();
                  } catch (Throwable t) {
                      return -1;
                  }
              }

              /** Списать ставку. true только если списано целиком. */
              synchronized boolean take(String key, long amount, String reason) {
                  if (amount <= 0) {
                      return true;
                  }
                  if (!init()) {
                      return false;
                  }
                  try {
                      return "OK".equals(String.valueOf(mWithdraw.invoke(eco, key, amount, reason)));
                  } catch (Throwable t) {
                      return false;
                  }
              }

              /**
               * Зачислить выигрыш. Возвращает сколько реально зачислено (может быть меньше при
               * max-balance в TpCoins) или -1, если не удалось и нужно повторить позже.
               */
              synchronized long give(String key, long amount, String reason) {
                  if (amount <= 0) {
                      return 0;
                  }
                  if (!init()) {
                      return -1;
                  }
                  try {
                      String r = String.valueOf(mDeposit.invoke(eco, key, amount, reason));
                      if ("OK".equals(r)) {
                          return amount;
                      }
                      if ("OVER_LIMIT".equals(r)) {
                          long room = ((Number) mRoom.invoke(eco, key)).longValue();
                          if (room <= 0) {
                              return 0;
                          }
                          String r2 = String.valueOf(mDeposit.invoke(eco, key, room, reason + " (лимит баланса)"));
                          return "OK".equals(r2) ? room : -1;
                      }
                      return -1;
                  } catch (Throwable t) {
                      return -1;
                  }
              }
          }
