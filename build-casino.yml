          package ru.eclips.casino;

          import java.security.SecureRandom;

          /** Весь рандом казино: только SecureRandom, решает сервер. */
          final class Rng {
              private static final SecureRandom R = new SecureRandom();

              private Rng() {
              }

              static int next(int bound) {
                  return R.nextInt(bound);
              }

              /** Индекс по весам. */
              static int weighted(int[] weights) {
                  int sum = 0;
                  for (int w : weights) {
                      sum += w;
                  }
                  int r = R.nextInt(sum);
                  for (int i = 0; i < weights.length; i++) {
                      r -= weights[i];
                      if (r < 0) {
                          return i;
                      }
                  }
                  return weights.length - 1;
              }
          }
