              /** Форма ставки: поле ввода (элемент 1), ползунок (2), для Мин и Рулетки ещё параметры (3, 4). */
              private void openBet(final Player p, final GameType t, String error) {
                  final long min = minBet();
                  final long max = maxBet();
                  final String key = Coins.key(p.getName());
                  int step = (int) Math.max(1, (max - min) / 99);
                  FormWindowCustom f = new FormWindowCustom(Fx.c("&l" + t.title + ": ставка"));
                  f.addElement(new ElementLabel(Fx.c(error == null
                          ? "&lБаланс: " + balanceText(key) + " монет"
                          : "&c&l" + error)));
                  f.addElement(new ElementInput(Fx.c("&lСтавка вручную (" + Fx.n(min) + " - " + Fx.n(max) + ")"),
                          "например " + min, ""));
                  f.addElement(new ElementSlider(Fx.c("&lИли выбери ползунком"), (float) min, (float) max, step, (float) min));
                  if (t == GameType.MINES) {
                      f.addElement(new ElementSlider(Fx.c("&lКоличество мин"), 1f, (float) (MinesGame.CELLS - 1), 1, 3f));
                  } else if (t == GameType.ROULETTE) {
                      f.addElement(new ElementDropdown(Fx.c("&lНа что ставишь"), Arrays.asList(RouletteGame.KINDS), 0));
                      f.addElement(new ElementInput(Fx.c("&lНомер (0-36, только для ставки на число)"), "например 17", ""));
                  }
                  showForm(p, f, r -> {
                      FormResponseCustom resp = (FormResponseCustom) r;
                      String in = resp.getInputResponse(1);
                      in = in == null ? "" : in.replaceAll("[\\s_]", "");
                      long bet;
                      if (!in.isEmpty()) {
                          if (!in.matches("\\d{1,9}")) {
                              openBet(p, t, "Ставка должна быть целым числом.");
                              return;
                          }
                          bet = Long.parseLong(in);
                      } else {
                          bet = Math.round(resp.getSliderResponse(2));
                      }
                      if (bet < min || bet > max) {
                          openBet(p, t, "Ставка должна быть от " + Fx.n(min) + " до " + Fx.n(max) + ".");
                          return;
                      }
                      if (coins.balance(key) < bet) {
                          openBet(p, t, "Недостаточно монет. Баланс: " + balanceText(key) + ".");
                          return;
                      }
                      int a = 0;
                      int b = 0;
                      if (t == GameType.MINES) {
                          a = Math.max(1, Math.min(MinesGame.CELLS - 1, Math.round(resp.getSliderResponse(3))));
                      } else if (t == GameType.ROULETTE) {
                          a = resp.getDropdownResponse(3).getElementID();
                          if (a == 12) {
                              String num = resp.getInputResponse(4);
                              num = num == null ? "" : num.trim();
                              if (!num.matches("\\d{1,2}") || Integer.parseInt(num) > 36) {
                                  openBet(p, t, "Для ставки на число укажи номер от 0 до 36.");
                                  return;
                              }
                              b = Integer.parseInt(num);
                          }
                      }
                      startRound(p, t, bet, a, b, false);
                  });
              }
          }
