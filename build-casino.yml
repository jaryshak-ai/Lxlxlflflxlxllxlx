              // ---------- звук ----------

              static void sound(Player p, String soundName, float pitch) {
                  try {
                      Class<?> sc = Class.forName("cn.nukkit.level.Sound");
                      Object snd = null;
                      for (Object o : sc.getEnumConstants()) {
