                              snd = o;
                              break;
                          }
                      }
                      if (snd == null) {
                          return;
                      }
                      Level lv = p.getLevel();
                      Vector3 pos = new Vector3(p.x, p.y, p.z);
                      for (Method m : lv.getClass().getMethods()) {
                          if (!m.getName().equals("addSound")) {
                              continue;
                          }
                          Class<?>[] pt = m.getParameterTypes();
                          if (pt.length == 5 && pt[1] == sc && pt[4].isArray()) {
                              m.invoke(lv, pos, snd, 1f, pitch, new Player[]{p});
                              return;
                          }
                      }
                  } catch (Throwable ignored) {
                      // звук не критичен
                  }
              }

              // ---------- фейковый блок ----------

              /** Отправить игроку блок (настоящий или фейковый) на позицию блока. Только ему. */
              static void sendBlock(Player p, Vector3 block) {
                  try {
                      Level lv = p.getLevel();
                      for (Method m : lv.getClass().getMethods()) {
                          if (!m.getName().equals("sendBlocks")) {
                              continue;
                          }
                          Class<?>[] pt = m.getParameterTypes();
                          if (pt.length == 2 && pt[0] == Player[].class && pt[1] == Vector3[].class) {
                              m.invoke(lv, new Player[]{p}, new Vector3[]{block});
                              return;
                          }
                      }
                  } catch (Throwable ignored) {
                      // нечего делать
                  }
              }

              /** Имя сундука (заголовок окна). Если не получилось - окно просто будет называться "Сундук". */
              static void sendChestName(Player p, int x, int y, int z, String title) {
                  try {
                      CompoundTag tag = new CompoundTag()
                              .putString("id", "Chest")
                              .putInt("x", x)
                              .putInt("y", y)
                              .putInt("z", z)
                              .putString("CustomName", c(title));
                      byte[] bytes = null;
                      Class<?> nbtio = Class.forName("cn.nukkit.nbt.NBTIO");
                      for (Method m : nbtio.getMethods()) {
                          if (!m.getName().equals("write")) {
                              continue;
                          }
                          Class<?>[] pt = m.getParameterTypes();
                          if (pt.length == 3 && pt[0] == CompoundTag.class && pt[1] == ByteOrder.class && pt[2] == boolean.class) {
                              bytes = (byte[]) m.invoke(null, tag, ByteOrder.LITTLE_ENDIAN, true);
                              break;
                          }
                      }
                      if (bytes == null) {
                          for (Method m : nbtio.getMethods()) {
                              if (!m.getName().equals("write")) {
                                  continue;
                              }
                              Class<?>[] pt = m.getParameterTypes();
                              if (pt.length == 2 && pt[0] == CompoundTag.class && pt[1] == ByteOrder.class) {
                                  bytes = (byte[]) m.invoke(null, tag, ByteOrder.LITTLE_ENDIAN);
                                  break;
                              }
                          }
                      }
                      if (bytes == null) {
                          return;
                      }
                      Class<?> pc = Class.forName("cn.nukkit.network.protocol.BlockEntityDataPacket");
                      Object pk = pc.getDeclaredConstructor().newInstance();
                      pc.getField("x").setInt(pk, x);
                      pc.getField("y").setInt(pk, y);
                      pc.getField("z").setInt(pk, z);
                      pc.getField("namedTag").set(pk, bytes);
                      p.dataPacket((DataPacket) pk);
                  } catch (Throwable ignored) {
                      // заголовок не критичен
                  }
              }
          }
