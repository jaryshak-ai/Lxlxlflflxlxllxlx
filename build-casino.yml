          package ru.eclips.casino;

          import cn.nukkit.item.Item;

          /** Базовый класс игры. Исход решается в prepare() на сервере ДО анимации. */
          abstract class Game {
              final Casino plugin;
              final Session s;

              Game(Casino plugin, Session s) {
                  this.plugin = plugin;
                  this.s = s;
              }

              /** Решить исход. Вернуть, сколько монет причитается игроку, если всё оборвётся прямо сейчас. */
              abstract long prepare();

              /** Нарисовать интерфейс (сундук уже открыт). */
              abstract void begin();

              void click(int slot) {
              }

              /** Вызывается каждый тик, пока сундук открыт. */
              void tick() {
              }

              /** Место для итоговой плашки. */
              abstract int infoSlot();

              abstract int replaySlot();

              abstract int menuSlot();

              /** Игра может поправить интерфейс перед итоговыми кнопками. */
              void decorateResult() {
              }

              final Menu menu() {
                  return s.menu;
              }

              final void paintBackground() {
                  Menu m = s.menu;
                  if (m != null) {
                      m.paintAll();
                  }
              }

              /** Завершить раунд: выплата, лог, итоговая плашка и кнопки. */
              final void finish(long win, String detail) {
                  plugin.settle(s, win, detail);
                  decorateResult();
                  showResult(win, detail);
                  Fx.sound(s.player, win > s.bet ? "RANDOM_LEVELUP" : "NOTE_BASS", 1f);
              }

              private void showResult(long win, String detail) {
                  Menu m = s.menu;
                  if (m == null) {
                      return;
                  }
                  Item info;
                  if (s.free) {
                      info = Fx.item(41, 0, "&a&lПриз: +" + Fx.n(win), "&7Бесплатный спин");
                  } else if (!s.played) {
                      info = Fx.item(266, 0, "&e&lСтавка возвращена: " + Fx.n(win));
                  } else if (win > s.bet) {
                      info = Fx.item(41, 0, "&a&lВыигрыш: +" + Fx.n(win), "&7Ставка: " + Fx.n(s.bet),
                              "&7Множитель: x" + Fx.mult((double) win / s.bet));
                  } else if (win == s.bet) {
                      info = Fx.item(266, 0, "&e&lВозврат ставки: " + Fx.n(win), "&7Ставка: " + Fx.n(s.bet));
                  } else if (win > 0) {
                      info = Fx.item(371, 0, "&6&lЧастичный возврат: +" + Fx.n(win), "&7Ставка: " + Fx.n(s.bet),
                              "&7Множитель: x" + Fx.mult((double) win / s.bet));
                  } else {
                      info = Fx.item(173, 0, "&c&lПроигрыш: -" + Fx.n(s.bet), "&7Ставка: " + Fx.n(s.bet));
                  }
                  m.setSlot(infoSlot(), info);
                  if (!s.free) {
                      m.setSlot(replaySlot(), Fx.wool(5, "&a&lИграть снова", "&7Ставка: " + Fx.n(s.bet) + " монет"));
                  }
                  m.setSlot(menuSlot(), Fx.wool(1, "&6&lВ меню", "&7Вернуться к выбору игры"));
                  s.resultShown = true;
              }
          }
